# Overlay for a single-user localhost deployment with a real chat model.
# The private .env.personal file is loaded by every process that may run model tasks.
services:
  api:
    env_file: .env.personal
    environment:
      EVOAGENT_PROVIDER: openai_compatible
    volumes:
      - type: bind
        source: ${EVOAGENT_PROJECTS_HOST_ROOT:?set an explicit host directory for authorized projects}
        target: /app/projects
  worker:
    env_file: .env.personal
    environment:
      EVOAGENT_PROVIDER: openai_compatible
    volumes:
      - type: bind
        source: ${EVOAGENT_PROJECTS_HOST_ROOT:?set an explicit host directory for authorized projects}
        target: /app/projects
  maintenance-worker:
    env_file: .env.personal
    environment:
      EVOAGENT_PROVIDER: openai_compatible
    volumes:
      - type: bind
        source: ${EVOAGENT_PROJECTS_HOST_ROOT:?set an explicit host directory for authorized projects}
        target: /app/projects
  eval-worker:
    env_file: .env.personal
    environment:
      EVOAGENT_PROVIDER: openai_compatible
    volumes:
      - type: bind
        source: ${EVOAGENT_PROJECTS_HOST_ROOT:?set an explicit host directory for authorized projects}
        target: /app/projects

# 专用验收环境；与开发环境分端口、分卷。测试库会被回归测试清空。
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: evoagent_test
      POSTGRES_USER: evoagent
      POSTGRES_PASSWORD: evoagent
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["acceptance-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoagent -d evoagent_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    profiles: [app]
    image: evoagent:phase4-final
    environment: &app-env
      EVOAGENT_DATABASE_URL: postgresql+asyncpg://evoagent:evoagent@postgres:5432/evoagent_fresh
      EVOAGENT_REDIS_URL: redis://redis:6379/0
      EVOAGENT_REDIS_NAMESPACE: phase4-final
      EVOAGENT_PROVIDER: mock
      EVOAGENT_API_HOST: 0.0.0.0
      EVOAGENT_WORKSPACE: /app/workspace
      EVOAGENT_ARTIFACT_ROOT: /app/workspace/artifacts
      EVOAGENT_CONTEXT_POLICY: legacy
      EVOAGENT_MEMORY_RETRIEVAL_ENABLED: "false"
      EVOAGENT_ARCHIVE_RETRIEVAL_ENABLED: "false"
      EVOAGENT_RETRIEVAL_BACKEND: lexical
    ports: ["127.0.0.1:18000:8000"]
    volumes: ["acceptance-workspace:/app/workspace"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    profiles: [app]
    image: evoagent:phase4-final
    command: [evoagent-worker]
    environment:
      <<: *app-env
      EVOAGENT_WORKER_CONCURRENCY: "2"
    volumes: ["acceptance-workspace:/app/workspace"]
    stop_grace_period: 310s
    depends_on:
      api: {condition: service_healthy}
  maintenance-worker:
    profiles: [app]
    image: evoagent:phase4-final
    command: [evoagent-maintenance-worker]
    environment: *app-env
    volumes: ["acceptance-workspace:/app/workspace"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  acceptance-postgres:
  acceptance-workspace:

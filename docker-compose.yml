services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: evoagent
      POSTGRES_USER: evoagent
      POSTGRES_PASSWORD: evoagent
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoagent -d evoagent"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - evoagent-postgres:/var/lib/postgresql/data

volumes:
  evoagent-postgres:

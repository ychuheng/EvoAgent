[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "evoagent"
version = "0.2.0.dev0"
description = "A testable agent runtime with a verifiable skill lifecycle."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "EvoAgent contributors" }]
dependencies = [
    "alembic>=1.19.1,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.135,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "pre-commit>=4,<5",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "respx>=0.23.1,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
evoagent = "evoagent.cli:main"
evoagent-api = "evoagent.api.main:main"
evoagent-worker = "evoagent.workers.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evoagent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "postgres: 需要真实 PostgreSQL 服务的集成测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

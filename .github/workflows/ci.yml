name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck and component tests
        working-directory: frontend
        run: pnpm run typecheck && pnpm run test
      - name: Production build
        working-directory: frontend
        run: pnpm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser flows
        working-directory: frontend
        run: pnpm run e2e

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: evoagent_test
          POSTGRES_USER: evoagent
          POSTGRES_PASSWORD: evoagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evoagent -d evoagent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test
        env:
          EVOAGENT_TEST_DATABASE_URL: postgresql+asyncpg://evoagent:evoagent@127.0.0.1:5432/evoagent_test
        run: pytest

  container:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Build application image
        run: docker build -t evoagent:ci .

  sandbox:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build and pin execution image in job-local registry
        run: |
          docker build -f deploy/sandbox/Dockerfile -t 127.0.0.1:5000/evoagent-sandbox:ci .
          docker push 127.0.0.1:5000/evoagent-sandbox:ci
          digest=$(docker image inspect 127.0.0.1:5000/evoagent-sandbox:ci --format '{{index .RepoDigests 0}}')
          echo "EVOAGENT_TEST_SANDBOX_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Validate controller deployment and build
        env:
          EVOAGENT_SANDBOX_CONTROLLER_TOKEN: ci-only-token-not-a-deployment-secret-123456
          EVOAGENT_SANDBOX_STAGING_ROOT: /var/lib/evoagent-sandbox
          EVOAGENT_MCP_LAUNCH_PROFILES: '{}'
        run: |
          export EVOAGENT_SANDBOX_PROFILES="$(python -c 'import json,os; print(json.dumps({"python":{"image":os.environ["EVOAGENT_TEST_SANDBOX_IMAGE"]}}))')"
          docker compose -f docker-compose.yml -f deploy/sandbox/compose.yml config --quiet
          docker build -f deploy/sandbox/Dockerfile.controller -t evoagent-controller:ci .
      - name: Verify real Linux container limits, network and cleanup
        env:
          EVOAGENT_RUN_DOCKER_TESTS: "1"
        run: pytest -q tests/integration/test_docker_sandbox.py

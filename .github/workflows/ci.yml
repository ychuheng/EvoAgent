name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck and component tests
        working-directory: frontend
        run: pnpm run typecheck && pnpm run test
      - name: Production build
        working-directory: frontend
        run: pnpm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser flows
        working-directory: frontend
        run: pnpm run e2e

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      # 必须取完整历史：`tests/unit/test_state_drift_gate.py` 会把
      # `docs/当前状态.md` 里记录的基准提交解析成真实提交，并比较 `基准..HEAD`。
      # 基准按约定总是 HEAD 的祖先（推进基准的那次提交之后必然还有提交），
      # 因此默认的 `--depth=1` 浅克隆里它**永远**取不到，状态漂移闸门会以
      # "基准提交不存在"这种误导性的理由在每个 push 上报红。
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure official Docker Hub cache on isolated runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_JOB python3 scripts/ci_docker.py configure
      - name: Start job-owned PostgreSQL and Redis
        run: python3 scripts/ci_docker.py test-services
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test
        env:
          EVOAGENT_TEST_DATABASE_URL: postgresql+asyncpg://evoagent:evoagent@127.0.0.1:5432/evoagent_test
          EVOAGENT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest

      - name: Replay phase four demos
        env:
          EVOAGENT_TEST_DATABASE_URL: postgresql+asyncpg://evoagent:evoagent@127.0.0.1:5432/evoagent_test
          EVOAGENT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: python scripts/phase4_demos.py --output output/phase4-demos.json
      - name: Preserve demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-demos-python-${{ matrix.python-version }}
          path: output/phase4-demos.json
      - name: Stop only this job's test containers
        if: always()
        run: python3 scripts/ci_docker.py stop

  container:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure official Docker Hub cache on isolated runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_JOB python3 scripts/ci_docker.py configure
      - name: Cache application base images before build
        run: docker pull node:24-alpine && docker pull python:3.13-slim
      - name: Validate Compose
        run: docker compose config
      - name: Build application image
        run: docker build -t evoagent:ci .

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure official Docker Hub cache on isolated runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_JOB python3 scripts/ci_docker.py configure
      - name: Start job-owned execution registry
        run: python3 scripts/ci_docker.py registry
      - name: Cache sandbox base images before build
        run: docker pull python:3.13-slim && docker pull docker:28-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build and pin execution image in job-local registry
        run: |
          docker build -f deploy/sandbox/Dockerfile -t 127.0.0.1:5000/evoagent-sandbox:ci .
          docker push 127.0.0.1:5000/evoagent-sandbox:ci
          digest=$(docker image inspect 127.0.0.1:5000/evoagent-sandbox:ci --format '{{index .RepoDigests 0}}')
          echo "EVOAGENT_TEST_SANDBOX_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Validate controller deployment and build
        env:
          EVOAGENT_SANDBOX_CONTROLLER_TOKEN: ci-only-token-not-a-deployment-secret-123456
          EVOAGENT_SANDBOX_STAGING_ROOT: /var/lib/evoagent-sandbox
          EVOAGENT_MCP_LAUNCH_PROFILES: '{}'
        run: |
          export EVOAGENT_SANDBOX_PROFILES="$(python -c 'import json,os; print(json.dumps({"python":{"image":os.environ["EVOAGENT_TEST_SANDBOX_IMAGE"]}}))')"
          docker compose -f docker-compose.yml -f deploy/sandbox/compose.yml config --quiet
          docker build -f deploy/sandbox/Dockerfile.controller -t evoagent-controller:ci .
      - name: Verify real Linux container limits, network and cleanup
        env:
          EVOAGENT_RUN_DOCKER_TESTS: "1"
        run: pytest -q tests/integration/test_docker_sandbox.py
      - name: Stop only this job's execution registry
        if: always()
        run: python3 scripts/ci_docker.py stop

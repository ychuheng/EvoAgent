name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: evoagent_test
          POSTGRES_USER: evoagent
          POSTGRES_PASSWORD: evoagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evoagent -d evoagent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test
        env:
          EVOAGENT_TEST_DATABASE_URL: postgresql+asyncpg://evoagent:evoagent@127.0.0.1:5432/evoagent_test
        run: pytest

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Build application image
        run: docker build -t evoagent:ci .
